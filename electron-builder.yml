appId: sk.bartalos.servis
productName: Servisná knižka Bartalos
directories:
  output: release
files:
  - dist/**
  - electron/dist/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: true
win:
  target: nsis
  icon: build/icon.png
  artifactName: ${name}-setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Servisná knižka Bartalos
publish:
  provider: github
  owner: JurajCukan
  repo: servis-bartalos
  releaseType: release
