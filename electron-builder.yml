appId: sk.bartalos.servis
productName: Servisná knižka Bartalos
directories:
  output: release
files:
  - dist/**
  - electron/dist/**
  - node_modules/**
  - package.json
  - "!node_modules/better-sqlite3/prebuilds/**"
  - node_modules/better-sqlite3/build/Release/better_sqlite3.node
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
buildDependenciesFromSource: false
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Servisná knižka Bartalos
publish:
  provider: github
  owner: JurajCukan
  repo: servis-bartalos
  releaseType: release
