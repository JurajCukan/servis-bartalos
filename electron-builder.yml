appId: sk.bartalos.servis
productName: Servisná knižka Bartalos
directories:
  output: release
files:
  - dist/**
  - electron/dist/**
  - pocketbase/pocketbase.exe
  - pocketbase/initial_pb_data/**
asar: true
asarUnpack:
  - "pocketbase/pocketbase.exe"
  - "pocketbase/initial_pb_data/**"
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Servisná knižka Bartalos
publish:
  provider: github
  owner: JurajCukan
  repo: servis-bartalos
  releaseType: release
